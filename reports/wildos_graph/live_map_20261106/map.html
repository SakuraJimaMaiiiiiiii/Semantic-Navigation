<html><section class="map-panel" id="exploration-panel"><header><h2>探索地图</h2><p>查看探索航点、物体标注和占据地图。</p>
<div class="map-toolbar"><button type="button" data-map-action="out" aria-label="缩小">− 缩小</button>
<output aria-label="缩放比例">100%</output><button type="button" data-map-action="in" aria-label="放大">＋ 放大</button>
<button type="button" data-map-action="reset">适应全图</button><span class="map-hint">滚轮缩放 · 拖动平移 · 双击复位</span></div></header>
<div class="map-canvas"><svg viewBox="-2 -2 4 4"><rect width="1" height="1"/></svg></div></section><section class="map-panel" id="graph-panel"><header><h2>导航图结构</h2><p>0 个导航节点 · 0 辆车辆 · 0 条边 · 0 个连通分量 · 0 个前沿点（紫点），紫环为前沿节点。底图：白色安全、深灰色障碍及净空不足、灰色未知。橙色为车辆观测轮廓的规划禁入投影，所有高度均禁止穿越；框外余量为深灰。规划约束不会回写车辆定位。车辆关联可单独开启。与上图采用相同朝向和显示范围；两图独立缩放。</p>
<div class="map-toolbar"><button type="button" data-map-action="out" aria-label="缩小">− 缩小</button>
<output aria-label="缩放比例">100%</output><button type="button" data-map-action="in" aria-label="放大">＋ 放大</button>
<button type="button" data-map-action="reset">适应全图</button><span class="map-hint">滚轮缩放 · 拖动平移 · 双击复位</span></div><div class="map-layers"><label><input type="checkbox" data-graph-layer="raw" checked>净空不足区（深灰）</label><label><input type="checkbox" data-graph-layer="safe" checked>安全自由区域</label><label><input type="checkbox" data-graph-layer="obstacles" checked>障碍（深灰）</label><label><input type="checkbox" data-graph-layer="uncovered" >未覆盖区域</label><label><input type="checkbox" data-graph-layer="frontiers" checked>前沿点 / 前沿节点紫环</label><label><input type="checkbox" data-graph-layer="vehicle-constraints" checked>车辆安全约束排除区</label><label><input type="checkbox" data-graph-layer="edges" checked>连接边</label><label><input type="checkbox" data-graph-layer="nodes" checked>节点</label><label><input type="checkbox" data-graph-layer="vehicles" checked>车辆（橙色方形及观测轮廓）</label><label><input type="checkbox" data-graph-layer="semantic-edges" >车辆关联（虚线，非通行边）</label></div><div class="graph-inspector">
<label>圆圈显示 <select data-radius-mode><option value="selected">仅查看的节点</option><option value="all">全部圆圈轮廓</option><option value="none">隐藏圆圈</option></select></label>
<label>半径类型 <select data-radius-kind><option value="free">当前自由半径</option><option value="explored">历史探索半径</option></select></label>
<label>边显示 <select data-edge-mode><option value="all">全部边</option><option value="selected">仅查看节点的邻边</option><option value="none">隐藏边</option></select></label>
<button type="button" data-clear-node>清除选择</button>
<span data-node-status>悬停或点击节点，查看自由半径和相邻连接。</span></div></header>
<div class="map-canvas"><svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 4 4" role="img" aria-label="导航图结构"><g transform="matrix(-0.0 -1.0 1.0 -0.0 0.0 0.0)"></g></svg></div></section><style id="wildos-combined-style">
.map-panel{margin:24px 0;background:#fff;border:1px solid #cbd5e1;border-radius:12px;overflow:hidden}
.map-panel header{padding:16px 20px;border-bottom:1px solid #e2e8f0;background:#f8fafc}
.map-panel h2{margin:0 0 8px;font-size:21px}.map-panel p{margin:6px 0;color:#475569}
.map-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.map-toolbar button{padding:7px 14px;border:1px solid #cbd5e1;border-radius:6px;background:white;cursor:pointer;font:inherit}
.map-toolbar button:hover{background:#e0f2fe}.map-toolbar output{min-width:55px;text-align:center;font-variant-numeric:tabular-nums}
.map-canvas{height:clamp(420px,72vh,900px);background:#e3e6e9;overflow:hidden}
#graph-panel .map-canvas,#graph-panel .map-canvas svg{background:#b0b0b0}
.map-panel .map-canvas svg{display:block;width:100%;height:100%;border:0;cursor:grab;touch-action:none;user-select:none}
.map-panel .map-canvas svg.dragging{cursor:grabbing}.map-layers{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:14px}
.map-layers label{cursor:pointer}.map-hint{font-size:14px}body{max-width:1800px;margin:20px auto;padding:0 18px}
.graph-inspector{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:14px}.graph-inspector select,.graph-inspector button{padding:6px;border:1px solid #cbd5e1;border-radius:5px;background:white;font:inherit}
@media(max-width:640px){.map-panel header{padding:12px}.map-canvas{height:60vh;min-height:350px}}
</style><script id="wildos-combined-controls">function wireGraphInspector(svg, root) {
  const mode=root.querySelector('[data-radius-mode]');if(!mode)return;
  const kind=root.querySelector('[data-radius-kind]');
  let selected=null, hovered=null, selectedObject=root.dataset.selectedObject||null;
  const objects=Array.from(svg.querySelectorAll('[data-object-id]'));
  const associations=Array.from(svg.querySelectorAll('[data-object-edge]'));
  const nodes=Array.from(svg.querySelectorAll('[data-node-id]'));
  const circles=Array.from(svg.querySelectorAll('[data-node-radius]'));
  const edges=Array.from(svg.querySelectorAll('[data-edge-source]'));
  const remembered=nodes.find(n=>n.dataset.stableId===root.dataset.selectedStableId);
  if(remembered)selected=remembered.dataset.nodeId;
  const edgeMode=root.querySelector('[data-edge-mode]');
  if(edgeMode&&edges.length>5000)edgeMode.value='selected';
  function render(){
    const selectedNode=nodes.find(n=>n.dataset.nodeId===selected);
    root.dataset.selectedStableId=selectedNode?selectedNode.dataset.stableId:'';
    root.dataset.selectedObject=selectedObject||'';
    const active=hovered===null?selected:hovered;
    circles.forEach(c=>{c.setAttribute('r',kind&&kind.value==='explored'?c.dataset.exploredRadius:c.dataset.freeRadius);c.style.display=mode.value==='all'||(mode.value==='selected'&&c.dataset.nodeRadius===active)?'':'none';});
    const associated=new Set(associations.filter(e=>e.dataset.objectEdge===selectedObject).map(e=>e.dataset.navTarget));
    nodes.forEach(n=>{n.setAttribute('stroke',n.dataset.nodeId===active||associated.has(n.dataset.nodeId)?'#f59e0b':'none');n.setAttribute('stroke-width','.06');});
    edges.forEach(e=>{const near=e.dataset.edgeSource===active||e.dataset.edgeTarget===active;e.style.display=edgeMode&&(edgeMode.value==='none'||edgeMode.value==='selected'&&!near)?'none':'';e.setAttribute('stroke-opacity',active===null?'.45':near?'1':'.12');e.setAttribute('stroke-width',near&&active!==null?'.065':'.025');});
    objects.forEach(o=>o.setAttribute('stroke-width',o.dataset.objectId===selectedObject?'.12':'.04'));
    associations.forEach(e=>e.setAttribute('stroke-opacity',selectedObject===null?'.5':e.dataset.objectEdge===selectedObject?'1':'.08'));
    svg.querySelectorAll('[data-object-outline]').forEach(e=>e.setAttribute('stroke-width',e.dataset.objectOutline===selectedObject?'.10':'.045'));
    const node=nodes.find(n=>n.dataset.nodeId===active);
    root.querySelector('[data-node-status]').textContent=node?'节点 '+(node.dataset.stableId||active)+' · 前沿点 '+(node.dataset.frontierCount||0)+' · 历史探索半径 '+Number(node.dataset.exploredRadius).toFixed(2)+' m · 自由半径 '+Number(node.dataset.freeRadius).toFixed(2)+' m · 相邻连接 '+edges.filter(e=>e.dataset.edgeSource===active||e.dataset.edgeTarget===active).length+' 条'+(node.dataset.aboveVehicles?' · 车辆上方（满足当前包围盒净空）: '+node.dataset.aboveVehicles:''):'悬停或点击节点，查看自由半径和相邻连接。';
    const object=objects.find(o=>o.dataset.objectId===selectedObject);
    if(object && active===null)root.querySelector('[data-node-status]').textContent=object.dataset.objectInfo;
  }
  objects.forEach(o=>{o.style.cursor='pointer';o.addEventListener('click',()=>{selectedObject=o.dataset.objectId;selected=null;hovered=null;render();});});
  nodes.forEach(node=>{
    node.style.cursor='pointer';
    node.addEventListener('mouseenter',()=>{hovered=node.dataset.nodeId;render();});
    node.addEventListener('mouseleave',()=>{hovered=null;render();});
    node.addEventListener('click',()=>{selected=node.dataset.nodeId;selectedObject=null;render();});
  });
  mode.addEventListener('change',render);
  if(kind)kind.addEventListener('change',render);
  if(edgeMode)edgeMode.addEventListener('change',render);
  const clear=root.querySelector('[data-clear-node]');
  const clearSelection=()=>{selected=null;hovered=null;selectedObject=null;render();};
  clear.addEventListener('click',clearSelection);
  svg._disposeInspector=()=>{
    mode.removeEventListener('change',render);
    if(kind)kind.removeEventListener('change',render);
    if(edgeMode)edgeMode.removeEventListener('change',render);
    clear.removeEventListener('click',clearSelection);
  };
  render();
}
(() => {
  document.querySelectorAll('.map-panel').forEach(panel => {
    const svg = panel.querySelector('svg');
    const original = svg.getAttribute('viewBox').trim().split(/[ ,]+/).map(Number);
    let box = original.slice(), drag = null, moved = false, userChanged = false;
    const readout = panel.querySelector('output');
    function render(){svg.setAttribute('viewBox',box.join(' '));readout.value=Math.round(original[2]/box[2]*100)+'%';}
    svg._wildosUpdateBounds=values=>{
      if(values.length!==4||!values.every(Number.isFinite)||values[2]<=0||values[3]<=0)return;
      original.splice(0,4,...values);if(!userChanged){box=original.slice();render();}
    };
    function local(x,y){return new DOMPoint(x,y).matrixTransform(svg.getScreenCTM().inverse());}
    function zoom(factor,anchor){
      userChanged=true;
      const next=Math.max(.25,Math.min(16,original[2]/box[2]*factor));
      const scale=original[2]/next/box[2];
      const point=anchor||{x:box[0]+box[2]/2,y:box[1]+box[3]/2};
      box=[point.x+(box[0]-point.x)*scale,point.y+(box[1]-point.y)*scale,box[2]*scale,box[3]*scale];render();
    }
    panel.querySelectorAll('[data-map-action]').forEach(button=>button.onclick=()=>{
      if(button.dataset.mapAction==='reset'){userChanged=false;box=original.slice();render();}
      else zoom(button.dataset.mapAction==='in'?1.25:1/1.25);
    });
    svg.addEventListener('wheel',event=>{event.preventDefault();zoom(Math.exp(-Math.max(-100,Math.min(100,event.deltaY))*.003),local(event.clientX,event.clientY));},{passive:false});
    svg.addEventListener('dblclick',event=>{event.preventDefault();userChanged=false;box=original.slice();render();});
    svg.addEventListener('pointerdown',event=>{
      if(event.button!==0||drag)return;
      drag={id:event.pointerId,x:event.clientX,y:event.clientY,box:box.slice(),inverse:svg.getScreenCTM().inverse()};moved=false;
    });
    svg.addEventListener('pointermove',event=>{
      if(!drag||event.pointerId!==drag.id)return;
      if(!moved&&Math.hypot(event.clientX-drag.x,event.clientY-drag.y)<4)return;
      if(!moved){userChanged=true;moved=true;svg.setPointerCapture(event.pointerId);svg.classList.add('dragging');}
      const a=new DOMPoint(drag.x,drag.y).matrixTransform(drag.inverse);
      const b=new DOMPoint(event.clientX,event.clientY).matrixTransform(drag.inverse);
      box=[drag.box[0]-(b.x-a.x),drag.box[1]-(b.y-a.y),drag.box[2],drag.box[3]];render();
    });
    const release=()=>{drag=null;svg.classList.remove('dragging');};
    window.addEventListener('pointerup',release);window.addEventListener('pointercancel',release);
    svg.addEventListener('lostpointercapture',release);
    svg.addEventListener('click',event=>{if(moved){event.stopImmediatePropagation();event.preventDefault();moved=false;}},true);
    panel.querySelectorAll('[data-graph-layer]').forEach(input=>input.onchange=()=>{
      svg.querySelector('#graph-'+input.dataset.graphLayer).style.display=input.checked?'':'none';
    });
    wireGraphInspector(svg,panel);
    render();
  });
})();</script></html>
